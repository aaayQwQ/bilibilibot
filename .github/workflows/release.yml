name: Publish v1.0.3 Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: publish-v1.0.3-${{ github.ref }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v1.0.3]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Wait for all CI checks on this exact commit
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            build=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "Build and Test")] | sort_by(.created_at) | last')
            codeql=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "CodeQL")] | sort_by(.created_at) | last')
            build_status=$(echo "$build" | jq -r '.status // empty')
            build_result=$(echo "$build" | jq -r '.conclusion // empty')
            codeql_status=$(echo "$codeql" | jq -r '.status // empty')
            codeql_result=$(echo "$codeql" | jq -r '.conclusion // empty')
            if [ "$build_status" = "completed" ] && [ "$codeql_status" = "completed" ]; then
              [ "$build_result" = "success" ] || { echo "Build and Test failed: $build_result"; exit 1; }
              [ "$codeql_result" = "success" ] || { echo "CodeQL failed: $codeql_result"; exit 1; }
              echo "build_run_id=$(echo "$build" | jq -r '.id')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for Build and Test and CodeQL."
          exit 1

      - name: Download artifacts from the exact tested run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.checks.outputs.build_run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Create platform archives
        run: |
          mkdir -p release-zips
          for dir in release-assets/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "../../release-zips/$name.zip" .)
          done
          test "$(find release-zips -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          ls -lh release-zips

      - name: Create v1.0.3 release and upload tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          release_ready=false
          for attempt in 1 2 3 4 5; do
            if gh release view v1.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then release_ready=true; break; fi
            gh release create v1.0.3 --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "bilibilibot v1.0.3" --notes-file CHANGELOG.md && { release_ready=true; break; }
            sleep $((attempt * 10))
          done
          [ "$release_ready" = true ] || { echo "Could not create v1.0.3 release."; exit 1; }
          uploaded=false
          for attempt in 1 2 3 4 5; do
            if gh release upload v1.0.3 release-zips/*.zip --repo "$GITHUB_REPOSITORY" --clobber; then uploaded=true; break; fi
            sleep $((attempt * 10))
          done
          [ "$uploaded" = true ] || { echo "Could not upload v1.0.3 assets."; exit 1; }

