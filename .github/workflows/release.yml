name: Publish v1.0.1 Release
on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: ["main"]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify release marker on tested commit
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          message=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --jq '.commit.message')
          if grep -Fq '[release v1.0.1]' <<< "$message"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "This successful build is not marked for release; skipping publication."
          fi

      - name: Verify CodeQL completed successfully for this commit
        if: steps.release_guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 40); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=30" --jq '[.workflow_runs[] | select(.name == "CodeQL") | {status: .status, conclusion: .conclusion}] | first')
            status=$(echo "$result" | jq -r '.status // empty')
            conclusion=$(echo "$result" | jq -r '.conclusion // empty')
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "CodeQL did not pass: $conclusion"; exit 1; }
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for CodeQL."
          exit 1

      - name: Download artifacts from the exact tested run
        if: steps.release_guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Create platform archives
        if: steps.release_guard.outputs.enabled == 'true'
        run: |
          mkdir -p release-zips
          for dir in release-assets/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "../../release-zips/$name.zip" .)
          done
          test -n "$(find release-zips -maxdepth 1 -name '*.zip' -print -quit)"
          ls -lh release-zips

      - name: Create v1.0.1 release and upload tested binaries
        if: steps.release_guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.0.1 --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "bilibilibot v1.0.1" \
              --notes-file CHANGELOG.md
          fi
          gh release upload v1.0.1 release-zips/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
