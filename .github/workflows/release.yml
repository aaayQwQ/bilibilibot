name: Publish v1.0.2 Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: publish-v1.0.2-${{ github.ref }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v1.0.2]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for all CI checks on this exact commit
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            build=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "Build and Test" and .head_sha == $sha)] | sort_by(.created_at) | last' --arg sha "$TARGET_SHA")
            codeql=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "CodeQL" and .head_sha == $sha)] | sort_by(.created_at) | last' --arg sha "$TARGET_SHA")
            build_status=$(echo "$build" | jq -r '.status // empty')
            build_result=$(echo "$build" | jq -r '.conclusion // empty')
            codeql_status=$(echo "$codeql" | jq -r '.status // empty')
            codeql_result=$(echo "$codeql" | jq -r '.conclusion // empty')
            if [ "$build_status" = "completed" ] && [ "$codeql_status" = "completed" ]; then
              [ "$build_result" = "success" ] || { echo "Build and Test failed: $build_result"; exit 1; }
              [ "$codeql_result" = "success" ] || { echo "CodeQL failed: $codeql_result"; exit 1; }
              echo "build_run_id=$(echo "$build" | jq -r '.id')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for Build and Test and CodeQL."
          exit 1

      - name: Download artifacts from the exact tested run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.checks.outputs.build_run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Create platform archives
        run: |
          mkdir -p release-zips
          for dir in release-assets/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "../../release-zips/$name.zip" .)
          done
          test "$(find release-zips -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          ls -lh release-zips

      - name: Create v1.0.2 release and upload tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if ! gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.0.2 --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "bilibilibot v1.0.2" \
              --notes-file CHANGELOG.md
          fi
          gh release upload v1.0.2 release-zips/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
