name: Build and Test
on:
  push:
    branches: [ main, "release/v1.0.0" ]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            qt_arch: win64_msvc2022_64
            artifact: bilibilibot-windows-x64
          - os: ubuntu-24.04
            name: Linux x64
            qt_arch: linux_gcc_64
            artifact: bilibilibot-linux-x64
          - os: macos-15-intel
            name: macOS x64
            qt_arch: clang_64
            artifact: bilibilibot-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebsockets
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/Release/bilibilibot.exe dist/
            windeployqt --dir dist --release --no-translations --compiler-runtime dist/bilibilibot.exe
          else
            cp build/bilibilibot dist/
          fi
          cp config.ini.example README.md CHANGELOG.md dist/
          mkdir -p dist/docs
          cp docs/PLUGIN_API.md dist/docs/
          cp -r plugins dist/
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
